<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Loto - PLAY</title>
</head>
<body>
    <div class="content text-center">
        <h1 class="text-3xl font-bold text-gray-900" th:text="${pais}">País</h1>
        <p class="mt-3 text-gray-500" th:text="'Combinación de ' + ${count} + ' números del 1 al ' + ${max}">Combinación</p>
        <div class="mt-6 flex justify-center gap-3">
            <span th:each="num : ${combinacion}" class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 text-white text-lg font-bold rounded-full" th:text="${num}">00</span>
        </div>
        <a href="/loto/menu" class="mt-8 inline-block px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors font-medium">Volver al menú</a>
    </div>
</body>
</html>
