<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Detalle - PLAY</title>
</head>
<body>
    <div class="content w-full max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Detalle del Libro</h1>
            <a th:href="@{/libros/menu}"
               class="text-sm text-indigo-600 hover:text-indigo-900 font-medium transition-colors">
                &larr; Volver al catálogo
            </a>
        </div>

        <div class="bg-white rounded-lg shadow p-8 space-y-6">
            <div class="border-b border-gray-200 pb-4">
                <span class="text-sm text-gray-500 uppercase tracking-wider">Título</span>
                <p class="text-xl font-semibold text-gray-900 mt-1" th:text="${libro.titulo}"></p>
            </div>

            <div class="border-b border-gray-200 pb-4">
                <span class="text-sm text-gray-500 uppercase tracking-wider">Autor</span>
                <p class="text-lg text-gray-700 mt-1" th:text="${libro.autor}"></p>
            </div>

            <div class="border-b border-gray-200 pb-4">
                <span class="text-sm text-gray-500 uppercase tracking-wider">Género</span>
                <p class="text-lg text-gray-700 mt-1" th:text="${libro.genero}"></p>
            </div>

            <div class="border-b border-gray-200 pb-4">
                <span class="text-sm text-gray-500 uppercase tracking-wider">Ejemplares</span>
                <p class="text-lg text-gray-700 mt-1" th:text="${libro.ejemplares}"></p>
            </div>

            <div class="border-b border-gray-200 pb-4">
                <span class="text-sm text-gray-500 uppercase tracking-wider">ID</span>
                <p class="text-lg text-gray-700 mt-1" th:text="${libro.id}"></p>
            </div>

            <div class="pt-2">
                <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                   class="inline-block px-5 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
                    Editar
                </a>
            </div>
        </div>
    </div>
</body>
</html>
