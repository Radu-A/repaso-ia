<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Detalle — PLAY</title>
</head>
<body>
    <div class="content flex-1 flex flex-col items-center px-4 py-10 sm:py-14">
        <div class="w-full max-w-xl">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-2xl sm:text-3xl font-display font-bold text-neutral-800">Detalle del Libro</h1>
                <a th:href="@{/libros/menu}"
                   class="inline-flex items-center gap-1 text-sm font-medium text-neutral-400 hover:text-amber-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Catálogo
                </a>
            </div>

            <div class="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden">
                <div class="px-6 py-5 border-b border-neutral-50">
                    <h2 class="text-xl font-display font-bold text-neutral-800" th:text="${libro.titulo}"></h2>
                    <p class="text-neutral-500 text-sm mt-0.5">por <span th:text="${libro.autor}"></span></p>
                </div>

                <div class="px-6 py-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-neutral-400">Género</span>
                        <span class="inline-block px-3 py-1 text-xs font-medium bg-neutral-100 text-neutral-600 rounded-full"
                              th:text="${libro.genero}"></span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-neutral-400">Ejemplares</span>
                        <span class="text-sm font-semibold text-neutral-700" th:text="${libro.ejemplares}"></span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-neutral-400">ID</span>
                        <span class="text-xs font-mono text-neutral-400" th:text="${libro.id}"></span>
                    </div>
                </div>

                <div class="px-6 py-4 bg-neutral-50/50 border-t border-neutral-50">
                    <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                       class="inline-flex items-center gap-2 px-5 py-2.5 bg-amber-500 text-white text-sm font-semibold rounded-xl hover:bg-amber-600 transition-colors shadow-sm shadow-amber-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Editar libro
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
