<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title th:text="${libro.id} == null ? 'Nuevo Libro' : 'Editar Libro'">Libro — PLAY</title>
</head>
<body>
    <div class="content flex-1 flex flex-col items-center px-4 py-10 sm:py-14">
        <div class="w-full max-w-lg">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-2xl sm:text-3xl font-display font-bold text-neutral-800"
                    th:text="${libro.id} == null ? 'Nuevo Libro' : 'Editar Libro'"></h1>
                <a th:href="@{/libros/menu}"
                   class="inline-flex items-center gap-1 text-sm font-medium text-neutral-400 hover:text-amber-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Volver
                </a>
            </div>

            <div class="bg-white rounded-2xl border border-neutral-100 shadow-sm p-6 sm:p-8">
                <form th:action="@{/libros/guardar}" th:object="${libro}" method="post" class="space-y-5">
                    <input type="hidden" th:field="*{id}">

                    <div>
                        <label for="titulo" class="block text-sm font-medium text-neutral-600 mb-1.5">Título</label>
                        <input type="text" id="titulo" th:field="*{titulo}"
                               class="w-full px-4 py-2.5 border border-neutral-200 rounded-xl text-neutral-800 placeholder-neutral-300 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-400 transition-colors"
                               placeholder="Título del libro" required>
                    </div>

                    <div>
                        <label for="autor" class="block text-sm font-medium text-neutral-600 mb-1.5">Autor</label>
                        <input type="text" id="autor" th:field="*{autor}"
                               class="w-full px-4 py-2.5 border border-neutral-200 rounded-xl text-neutral-800 placeholder-neutral-300 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-400 transition-colors"
                               placeholder="Nombre del autor" required>
                    </div>

                    <div>
                        <label for="genero" class="block text-sm font-medium text-neutral-600 mb-1.5">Género</label>
                        <select id="genero" th:field="*{genero}"
                                class="w-full px-4 py-2.5 border border-neutral-200 rounded-xl text-neutral-800 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-400 bg-white transition-colors" required>
                            <option value="">Selecciona un género</option>
                            <option th:each="g : ${generos}" th:value="${g}" th:text="${g}"></option>
                        </select>
                    </div>

                    <div>
                        <label for="ejemplares" class="block text-sm font-medium text-neutral-600 mb-1.5">Ejemplares</label>
                        <input type="number" id="ejemplares" th:field="*{ejemplares}" min="0"
                               class="w-full px-4 py-2.5 border border-neutral-200 rounded-xl text-neutral-800 placeholder-neutral-300 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-400 transition-colors"
                               placeholder="Número de ejemplares" required>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit"
                                class="px-6 py-2.5 bg-amber-500 text-white text-sm font-semibold rounded-xl hover:bg-amber-600 transition-colors shadow-sm shadow-amber-200">
                            Guardar
                        </button>
                        <a th:href="@{/libros/menu}"
                           class="px-6 py-2.5 border border-neutral-200 text-neutral-600 text-sm font-medium rounded-xl hover:bg-neutral-50 hover:text-neutral-800 transition-colors">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
