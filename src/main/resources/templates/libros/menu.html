<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Libros - PLAY</title>
</head>
<body>
    <div class="content w-full max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Catálogo de Libros</h1>
            <a href="/libros/nuevo"
               class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
                + Nuevo
            </a>
        </div>
        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Autor</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Género</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ejemplares</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="libro : ${libros}" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <a th:href="@{/libros/{id}(id=${libro.id})}"
                               class="text-indigo-600 hover:text-indigo-900 font-medium">
                                <span th:text="${libro.titulo}"></span>
                            </a>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700" th:text="${libro.autor}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <a th:href="@{/libros/filtro/{genero}(genero=${libro.genero})}"
                               class="text-indigo-600 hover:text-indigo-900 font-medium">
                                <span th:text="${libro.genero}"></span>
                            </a>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-700" th:text="${libro.ejemplares}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex gap-2">
                                <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                                   class="text-sm text-indigo-600 hover:text-indigo-900 font-medium transition-colors">Editar</a>
                                <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}"
                                   class="text-sm text-red-600 hover:text-red-900 font-medium transition-colors">Eliminar</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
