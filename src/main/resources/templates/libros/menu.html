<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Catálogo — PLAY</title>
</head>
<body>
    <div class="content flex-1 w-full max-w-5xl mx-auto px-4 py-10 sm:py-14">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-display font-bold text-neutral-800">Catálogo de Libros</h1>
                <p class="text-neutral-400 text-sm mt-1" th:text="'${#lists.size(libros)} títulos'">0 títulos</p>
            </div>
            <a href="/libros/nuevo"
               class="inline-flex items-center gap-2 px-5 py-2.5 bg-amber-500 text-white text-sm font-semibold rounded-xl hover:bg-amber-600 transition-colors shadow-sm shadow-amber-200 self-start">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Nuevo libro
            </a>
        </div>

        <div th:if="${#lists.isEmpty(libros)}" class="text-center py-16 text-neutral-400">
            <p class="text-lg">No hay libros en el catálogo.</p>
        </div>

        <th:block th:unless="${#lists.isEmpty(libros)}">
            <div class="hidden sm:block bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden">
                <table class="min-w-full divide-y divide-neutral-100">
                    <thead>
                        <tr class="bg-neutral-50/50">
                            <th class="px-6 py-4 text-left text-xs font-semibold text-neutral-400 uppercase tracking-wider">Título</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-neutral-400 uppercase tracking-wider">Autor</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-neutral-400 uppercase tracking-wider">Género</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-neutral-400 uppercase tracking-wider">Ejs.</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-neutral-400 uppercase tracking-wider w-28"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-neutral-50">
                        <tr th:each="libro : ${libros}" class="hover:bg-neutral-50/50 transition-colors">
                            <td class="px-6 py-4">
                                <a th:href="@{/libros/{id}(id=${libro.id})}"
                                   class="text-neutral-800 hover:text-amber-600 font-medium transition-colors"
                                   th:text="${libro.titulo}"></a>
                            </td>
                            <td class="px-6 py-4 text-neutral-500 text-sm" th:text="${libro.autor}"></td>
                            <td class="px-6 py-4">
                                <a th:href="@{/libros/filtro/{genero}(genero=${libro.genero})}"
                                   class="inline-block px-3 py-1 text-xs font-medium bg-neutral-100 text-neutral-500 rounded-full hover:bg-amber-100 hover:text-amber-700 transition-colors"
                                   th:text="${libro.genero}"></a>
                            </td>
                            <td class="px-6 py-4 text-neutral-500 text-sm" th:text="${libro.ejemplares}"></td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                                       class="text-xs font-medium text-neutral-400 hover:text-amber-600 transition-colors">Editar</a>
                                    <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}"
                                       class="text-xs font-medium text-neutral-400 hover:text-red-500 transition-colors">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="sm:hidden space-y-3">
                <div th:each="libro : ${libros}" class="bg-white rounded-xl border border-neutral-100 shadow-sm p-5">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <a th:href="@{/libros/{id}(id=${libro.id})}"
                               class="text-neutral-800 hover:text-amber-600 font-semibold transition-colors truncate block"
                               th:text="${libro.titulo}"></a>
                            <p class="text-neutral-400 text-sm mt-1" th:text="${libro.autor}"></p>
                            <div class="flex items-center gap-2 mt-2">
                                <a th:href="@{/libros/filtro/{genero}(genero=${libro.genero})}"
                                   class="inline-block px-2.5 py-0.5 text-xs font-medium bg-neutral-100 text-neutral-500 rounded-full hover:bg-amber-100 hover:text-amber-700 transition-colors"
                                   th:text="${libro.genero}"></a>
                                <span class="text-xs text-neutral-400" th:text="${libro.ejemplares} + ' ejs.'"></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                               class="text-xs font-medium text-neutral-400 hover:text-amber-600 transition-colors">Editar</a>
                            <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}"
                               class="text-xs font-medium text-neutral-400 hover:text-red-500 transition-colors">Eliminar</a>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</body>
</html>
