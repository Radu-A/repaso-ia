<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">PLAY</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        body: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .font-display { font-family: 'Playfair Display', Georgia, serif; }
        .font-body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-neutral-50 font-body text-neutral-900 antialiased">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-neutral-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center gap-3 shrink-0">
                    <img src="/images/logo-sm.jpg" alt="PLAY" class="h-9 w-auto rounded-md">
                    <span class="text-xl font-display font-bold tracking-tight text-neutral-800">PLAY</span>
                </a>

                <nav class="hidden md:flex items-center gap-1">
                    <a href="/" class="px-4 py-2 text-sm font-medium text-neutral-500 hover:text-amber-600 transition-colors rounded-lg">Home</a>
                    <a href="/loto/menu" class="px-4 py-2 text-sm font-medium text-neutral-500 hover:text-amber-600 transition-colors rounded-lg">Loto</a>
                    <a href="/libros/menu" class="px-4 py-2 text-sm font-medium text-neutral-500 hover:text-amber-600 transition-colors rounded-lg">Libros</a>
                    <a href="/imagenes" class="px-4 py-2 text-sm font-medium text-neutral-500 hover:text-amber-600 transition-colors rounded-lg">Imágenes</a>
                </nav>

                <button id="menu-toggle" class="md:hidden p-2 text-neutral-500 hover:text-amber-600 transition-colors" aria-label="Abrir menú">
                    <svg id="menu-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden border-t border-neutral-100 bg-white/95 backdrop-blur-md">
            <nav class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-1">
                <a href="/" class="px-4 py-3 text-sm font-medium text-neutral-600 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors">Home</a>
                <a href="/loto/menu" class="px-4 py-3 text-sm font-medium text-neutral-600 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors">Loto</a>
                <a href="/libros/menu" class="px-4 py-3 text-sm font-medium text-neutral-600 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors">Libros</a>
                <a href="/imagenes" class="px-4 py-3 text-sm font-medium text-neutral-600 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors">Imágenes</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 flex flex-col">
        <th:block th:replace="${content}"/>
    </main>

    <footer class="border-t border-neutral-100 bg-white">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-neutral-400">
            &copy; 2026 PLAY
        </div>
    </footer>

    <script>
        (function() {
            var toggle = document.getElementById('menu-toggle');
            var menu = document.getElementById('mobile-menu');
            var openIcon = document.getElementById('menu-icon-open');
            var closeIcon = document.getElementById('menu-icon-close');
            toggle.addEventListener('click', function() {
                menu.classList.toggle('hidden');
                openIcon.classList.toggle('hidden');
                closeIcon.classList.toggle('hidden');
            });
        })();
    </script>
</body>
</html>
