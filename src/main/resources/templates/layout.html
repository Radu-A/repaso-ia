<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">PLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <a href="/" class="flex items-center gap-2">
                <img src="/images/logo-sm.jpg" alt="Logo" class="h-8 w-auto rounded">
                <span class="text-xl font-bold text-gray-900 tracking-wide">PLAY</span>
            </a>
            <nav class="flex gap-6 text-sm">
                <a href="/" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Home</a>
                <a href="/loto" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Loto</a>
                <a href="/libros" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Libros</a>
                <a href="/imagenes" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Imágenes</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <th:block th:replace="${content}"/>
    </main>

    <footer class="bg-white border-t py-4 text-center text-gray-400 text-sm">
        &copy; 2026 PLAY. Todos los derechos reservados.
    </footer>
</body>
</html>
