<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Resultado - PLAY</title>
</head>
<body>
    <div class="content w-full max-w-2xl mx-auto text-center">
        <th:block th:if="${acierto}">
            <div class="mb-6">
                <span class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full">
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </span>
            </div>
            <h1 class="text-3xl font-bold text-green-700 mb-4">¡Correcto!</h1>
            <p class="text-lg text-gray-600 mb-8">
                Efectivamente es <span class="font-bold text-gray-900" th:text="${imagen.ciudad}"></span>
            </p>
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-8">
                <div class="aspect-[16/10] overflow-hidden bg-gray-100">
                    <img th:src="${imagen.rutaImagen}" alt="Capital"
                         class="w-full h-full object-cover">
                </div>
            </div>
        </th:block>

        <th:block th:unless="${acierto}">
            <div class="mb-6">
                <span class="inline-flex items-center justify-center w-20 h-20 bg-red-100 rounded-full">
                    <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </span>
            </div>
            <h1 class="text-3xl font-bold text-red-700 mb-4">¡Incorrecto!</h1>
            <p class="text-lg text-gray-600 mb-2">
                Elegiste <span class="font-bold text-red-600" th:text="${elegida.ciudad}"></span>
            </p>
            <p class="text-lg text-gray-600 mb-8">
                La respuesta correcta es <span class="font-bold text-green-700" th:text="${imagen.ciudad}"></span>
            </p>
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-8">
                <div class="aspect-[16/10] overflow-hidden bg-gray-100">
                    <img th:src="${imagen.rutaImagen}" alt="Capital"
                         class="w-full h-full object-cover">
                </div>
            </div>
        </th:block>

        <a href="/imagenes/menu"
           class="inline-block px-8 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors shadow-md">
            Jugar otra vez
        </a>
    </div>
</body>
</html>
