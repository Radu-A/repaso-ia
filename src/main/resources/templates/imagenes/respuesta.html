<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Resultado — PLAY</title>
</head>
<body>
    <div class="content flex-1 flex flex-col items-center px-4 py-10 sm:py-14">
        <div class="w-full max-w-2xl text-center">

            <th:block th:if="${acierto}">
                <div class="mb-6">
                    <span class="inline-flex items-center justify-center w-20 h-20 bg-emerald-50 rounded-full">
                        <svg class="w-10 h-10 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                </div>
                <h1 class="text-3xl font-display font-bold text-emerald-600 mb-3">¡Correcto!</h1>
                <p class="text-neutral-500 mb-8">
                    Efectivamente es <span class="font-semibold text-neutral-800" th:text="${imagen.ciudad}"></span>
                </p>
            </th:block>

            <th:block th:unless="${acierto}">
                <div class="mb-6">
                    <span class="inline-flex items-center justify-center w-20 h-20 bg-red-50 rounded-full">
                        <svg class="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </span>
                </div>
                <h1 class="text-3xl font-display font-bold text-red-500 mb-3">¡Incorrecto!</h1>
                <p class="text-neutral-500 mb-1">
                    Elegiste <span class="font-semibold text-red-500" th:text="${elegida.ciudad}"></span>
                </p>
                <p class="text-neutral-500 mb-8">
                    La respuesta correcta es <span class="font-semibold text-emerald-600" th:text="${imagen.ciudad}"></span>
                </p>
            </th:block>

            <div class="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden mb-8">
                <div class="aspect-[16/10] overflow-hidden bg-neutral-100">
                    <img th:src="${imagen.rutaImagen}" alt="Capital"
                         class="w-full h-full object-cover">
                </div>
            </div>

            <a href="/imagenes/menu"
               class="inline-flex items-center gap-2 px-8 py-3 bg-amber-500 text-white font-semibold rounded-xl hover:bg-amber-600 transition-colors shadow-sm shadow-amber-200">
                Jugar otra vez
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
