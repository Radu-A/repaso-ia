<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Adivina la capital - PLAY</title>
</head>
<body>
    <div class="content w-full max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 text-center mb-2">¿Qué capital es?</h1>
        <p class="text-center text-gray-500 mb-8">Mira la imagen y selecciona la ciudad correcta</p>

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-8">
            <div class="aspect-[16/10] overflow-hidden bg-gray-100">
                <img th:src="${imagen.rutaImagen}" alt="Capital misteriosa"
                     class="w-full h-full object-cover">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <a th:each="opcion : ${opciones}"
               th:href="@{/imagenes/respuesta/{idImagen}/{idOpcion}(idImagen=${imagen.id}, idOpcion=${opcion.id})}"
               th:text="${opcion.ciudad}"
               class="block px-6 py-4 bg-white border-2 border-gray-200 rounded-xl text-center text-lg font-semibold text-gray-700 hover:border-blue-500 hover:text-blue-600 hover:shadow-md transition-all duration-200 cursor-pointer">
            </a>
        </div>
    </div>
</body>
</html>
