<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Adivina la capital — PLAY</title>
</head>
<body>
    <div class="content flex-1 flex flex-col items-center px-4 py-10 sm:py-14">
        <div class="w-full max-w-2xl">
            <h1 class="text-2xl sm:text-3xl font-display font-bold text-neutral-800 text-center mb-1">¿Qué capital es?</h1>
            <p class="text-center text-neutral-400 text-sm mb-8">Mira la imagen y selecciona la ciudad</p>

            <div class="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden mb-8">
                <div class="aspect-[16/10] overflow-hidden bg-neutral-100">
                    <img th:src="${imagen.rutaImagen}" alt="Capital misteriosa"
                         class="w-full h-full object-cover">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                <a th:each="opcion : ${opciones}"
                   th:href="@{/imagenes/respuesta/{idImagen}/{idOpcion}(idImagen=${imagen.id}, idOpcion=${opcion.id})}"
                   th:text="${opcion.ciudad}"
                   class="block px-6 py-4 bg-white border-2 border-neutral-100 rounded-xl text-center font-semibold text-neutral-600 hover:border-amber-400 hover:text-amber-600 hover:shadow-md transition-all duration-200">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
